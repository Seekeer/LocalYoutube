name: Flutter Android build
run-name: Android ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'preview' }} · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel (Stable is built only on demand)
        type: choice
        options: [preview, stable]
        default: preview
        required: true
  push:
    branches: [main]
    paths:
      - 'Flutter/**'
      - '.localtube/source.json'
      - '.github/workflows/flutter-build.yml'
  pull_request:
    paths:
      - 'Flutter/**'
      - '.github/workflows/flutter-build.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'preview' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LOCALTUBE_PREVIEW_APPLICATION_ID: ${{ vars.PREVIEW_APPLICATION_ID }}
      UPDATE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'preview' }}
    defaults:
      run:
        working-directory: Flutter
        shell: bash
    steps:
      - name: Checkout complete source history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Validate canonical source contract
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          EXPECTED_APPLICATION_ID: ${{ vars[format('{0}_APPLICATION_ID', env.UPDATE_CHANNEL == 'stable' && 'STABLE' || 'PREVIEW')] }}
          EXPECTED_CERTIFICATE: ${{ vars[format('{0}_CERTIFICATE_SHA256', env.UPDATE_CHANNEL == 'stable' && 'STABLE' || 'PREVIEW')] }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          source = Path('../.localtube/source.json')
          if not source.is_file():
              raise SystemExit('Canonical source contract is missing; complete the export compatibility task first.')
          data = json.loads(source.read_text())
          assert data['schemaVersion'] == 1
          assert re.fullmatch('[0-9a-f]{40}', data['sourceCommit'])
          code = data['versionCode']
          assert type(code) is int and 1000000000 < code <= 2100000000
          assert re.fullmatch(r'[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+', os.environ['EXPECTED_APPLICATION_ID'])
          assert re.fullmatch('[0-9a-fA-F]{64}', os.environ['EXPECTED_CERTIFICATE'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'BUILD_NUMBER={code}\nVERSION_NAME=1.0.{code - 1000000000}\n')
              output.write('EXPECTED_APPLICATION_ID=' + os.environ['EXPECTED_APPLICATION_ID'] + '\n')
              output.write('EXPECTED_CERTIFICATE=' + os.environ['EXPECTED_CERTIFICATE'].lower() + '\n')
          PY

      - name: Prepare configured channel signing identity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE: ${{ secrets[format('{0}_UPLOAD_KEYSTORE_B64', env.UPDATE_CHANNEL == 'stable' && 'STABLE' || 'PREVIEW')] }}
          KEY_ALIAS: ${{ secrets[format('{0}_UPLOAD_KEY_ALIAS', env.UPDATE_CHANNEL == 'stable' && 'STABLE' || 'PREVIEW')] }}
          KEY_PASSWORD: ${{ secrets[format('{0}_UPLOAD_KEY_PASSWORD', env.UPDATE_CHANNEL == 'stable' && 'STABLE' || 'PREVIEW')] }}
          STORE_PASSWORD: ${{ secrets[format('{0}_UPLOAD_STORE_PASSWORD', env.UPDATE_CHANNEL == 'stable' && 'STABLE' || 'PREVIEW')] }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ('KEYSTORE', 'KEY_ALIAS', 'KEY_PASSWORD', 'STORE_PASSWORD')
          if not all(os.environ.get(name) for name in names):
              raise SystemExit('Channel signing secrets are required; debug-key fallback is forbidden.')
          # Java properties escaping preserves passwords containing backslashes,
          # whitespace, separators or non-ASCII characters.
          def escape(value):
              return ''.join(chr(92) + 'u%04x' % unit for unit in
                             [int.from_bytes(value.encode('utf-16-be')[i:i+2], 'big')
                              for i in range(0, len(value.encode('utf-16-be')), 2)])
          store = Path(os.environ['RUNNER_TEMP']) / 'channel-upload.jks'
          store.write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          store.chmod(0o600)
          properties = {'storeFile': str(store), 'keyAlias': os.environ['KEY_ALIAS'],
                        'keyPassword': os.environ['KEY_PASSWORD'], 'storePassword': os.environ['STORE_PASSWORD']}
          target = Path('android/key.properties')
          target.write_text(''.join(key + '=' + escape(value) + '\n' for key, value in properties.items()))
          target.chmod(0o600)
          PY

      - name: Build signed channel APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [[ "$UPDATE_CHANNEL" == stable ]]; then
            flutter build apk --release --flavor stage --target lib/main_stage.dart \
              --dart-define-from-file=config/env/stage.json \
              --dart-define=LOCALTUBE_REQUIRE_SERVER_CONFIG=true \
              --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER" \
              --obfuscate --split-debug-info=build/symbols/stage/android
            apk=build/app/outputs/flutter-apk/app-stage-release.apk
          else
            flutter build apk --debug --flavor prod --target lib/main_prod.dart \
              --dart-define-from-file=config/env/prod.json \
              --dart-define=LOCALTUBE_REQUIRE_SERVER_CONFIG=true \
              --dart-define=LOCALTUBE_APK_UPDATES_ENABLED=true \
              --dart-define=LOCALTUBE_PREVIEW_APPLICATION_ID="$EXPECTED_APPLICATION_ID" \
              --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER"
            apk=build/app/outputs/flutter-apk/app-prod-debug.apk
          fi
          mkdir -p ../delivery
          cp "$apk" ../delivery/update.apk

      - name: Verify signed APK and create delivery manifest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          tools = sorted((Path(os.environ['ANDROID_HOME']) / 'build-tools').glob('*/apksigner'),
                         key=lambda path: tuple(int(p) for p in re.findall(r'\d+', path.parent.name)))[-1].parent
          apk = Path('../delivery/update.apk')
          signing = subprocess.check_output([str(tools/'apksigner'), 'verify', '--print-certs', str(apk)], text=True)
          certificates = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]{64})$', signing, re.M)
          assert [value.lower() for value in certificates] == [os.environ['EXPECTED_CERTIFICATE']]
          badging = subprocess.check_output([str(tools/'aapt'), 'dump', 'badging', str(apk)], text=True)
          identity = re.search(r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", badging, re.M)
          assert identity and identity[1] == os.environ['EXPECTED_APPLICATION_ID']
          code = int(identity[2])
          assert code == int(os.environ['BUILD_NUMBER'])
          # Audit the actual packaged permissions, including plugin manifests.
          permissions = set(re.findall(r"uses-permission(?:-sdk-\d+)?: name='([^']+)'", badging))
          allowed = {'android.permission.INTERNET', 'android.permission.CAMERA',
                     'android.permission.ACCESS_NETWORK_STATE', 'android.permission.ACCESS_WIFI_STATE',
                     'android.permission.FOREGROUND_SERVICE', 'android.permission.FOREGROUND_SERVICE_DATA_SYNC',
                     'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK', 'android.permission.WAKE_LOCK',
                     'android.permission.POST_NOTIFICATIONS', 'android.permission.RECEIVE_BOOT_COMPLETED',
                     os.environ['EXPECTED_APPLICATION_ID'] + '.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'}
          if os.environ['UPDATE_CHANNEL'] == 'preview':
              allowed.add('android.permission.REQUEST_INSTALL_PACKAGES')
          assert permissions <= allowed, 'Unexpected packaged Android permissions: ' + str(permissions - allowed)
          with apk.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          source = json.loads(Path('../.localtube/source.json').read_text())
          channel = os.environ['UPDATE_CHANNEL']
          metadata = {'channel': channel, 'applicationId': identity[1], 'versionCode': code,
                      'versionName': identity[3], 'size': apk.stat().st_size, 'sha256': digest,
                      'artifactId': f'{code}-{digest}'}
          manifest = {'schemaVersion': 1, 'repository': os.environ['GITHUB_REPOSITORY'],
                      'githubCommit': os.environ['GITHUB_SHA'], 'sourceCommit': source['sourceCommit'],
                      'runId': int(os.environ['GITHUB_RUN_ID']), 'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                      'channel': channel, 'apk': metadata}
          Path('../delivery/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Upload immutable delivery artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localtube-${{ env.UPDATE_CHANNEL }}-update
          path: delivery/*
          if-no-files-found: error
          retention-days: 30

      - name: Retain Stable symbols
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && env.UPDATE_CHANNEL == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localtube-stable-symbols
          path: Flutter/build/symbols/stage/android
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/channel-upload.jks"
