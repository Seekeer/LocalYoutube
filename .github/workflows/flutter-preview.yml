name: LocalTube transcript debug snapshot
run-name: Transcript debug · ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: Flutter
        shell: bash
    env:
      LOCALTUBE_PREVIEW_APPLICATION_ID: ${{ vars.PREVIEW_APPLICATION_ID }}
      LOCALTUBE_STABLE_APPLICATION_ID: ${{ vars.STABLE_APPLICATION_ID }}
      EXPECTED_CERTIFICATE: ${{ vars.PREVIEW_CERTIFICATE_SHA256 }}
    steps:
      - name: Verify external runner
        working-directory: ${{ github.workspace }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          echo "Building on GitHub-hosted $RUNNER_OS / $RUNNER_NAME"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: false
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze changed modules
        run: >-
          flutter analyze --no-fatal-infos --no-fatal-warnings
          lib/features/transcript lib/features/player/presentation/player_controller.dart
          lib/features/player/presentation/player_page.dart
          lib/features/cast/presentation/remote_control_mode_view.dart
          lib/app/bootstrap/app_bootstrap.dart lib/app/sync/app_sync_coordinator.dart
          test/transcript_test.dart test/transcript_panel_test.dart
          test/transcript_repository_test.dart test/player_page_widget_test.dart
      - name: Test transcript, bookmarks, player and sync
        run: >-
          flutter test --concurrency=2
          test/transcript_test.dart test/transcript_panel_test.dart
          test/transcript_repository_test.dart test/bookmarks_repository_test.dart
          test/player_page_widget_test.dart test/app_sync_lifecycle_listener_test.dart
      - name: Prepare existing Preview signing identity
        env:
          KEYSTORE: ${{ secrets.PREVIEW_UPLOAD_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.PREVIEW_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PREVIEW_UPLOAD_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.PREVIEW_UPLOAD_STORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, re, subprocess
          from pathlib import Path
          assert all(os.environ.get(key) for key in ('KEYSTORE', 'KEY_ALIAS', 'KEY_PASSWORD', 'STORE_PASSWORD'))
          assert re.fullmatch('[0-9a-fA-F]{64}', os.environ['EXPECTED_CERTIFICATE'])
          assert os.environ['LOCALTUBE_PREVIEW_APPLICATION_ID']
          store = Path(os.environ['RUNNER_TEMP']) / 'transcript-debug.jks'
          store.write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          store.chmod(0o600)
          certificate = subprocess.check_output(['keytool', '-exportcert', '-keystore', str(store),
              '-alias', os.environ['KEY_ALIAS'], '-storepass:env', 'STORE_PASSWORD'])
          assert hashlib.sha256(certificate).hexdigest() == os.environ['EXPECTED_CERTIFICATE'].lower()
          def escape(value):
              raw = value.encode('utf-16-be')
              return ''.join(chr(92) + 'u%04x' % int.from_bytes(raw[i:i+2], 'big') for i in range(0, len(raw), 2))
          properties = {'storeFile': str(store), 'keyAlias': os.environ['KEY_ALIAS'],
                        'keyPassword': os.environ['KEY_PASSWORD'], 'storePassword': os.environ['STORE_PASSWORD']}
          target = Path('android/key.properties')
          target.write_text(''.join(key + '=' + escape(value) + '\n' for key, value in properties.items()))
          target.chmod(0o600)
          PY
      - name: Build debug APK
        run: |
          code=$(python3 -c 'import json; print(json.load(open("../.localtube/source.json"))["versionCode"])')
          flutter build apk --debug --flavor prod --target lib/main_prod.dart \
            --dart-define-from-file=config/env/prod.json \
            --dart-define=LOCALTUBE_REQUIRE_SERVER_CONFIG=true \
            --dart-define=LOCALTUBE_APK_UPDATES_ENABLED=false \
            --dart-define=LOCALTUBE_PREVIEW_APPLICATION_ID="$LOCALTUBE_PREVIEW_APPLICATION_ID" \
            --build-name=1.1.transcript --build-number="$code"
          mkdir -p ../debug-output
          cp build/app/outputs/flutter-apk/app-prod-debug.apk ../debug-output/localtube-transcript-debug.apk
      - name: Verify APK identity and signature
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'tool/ci')
          from apk_signing import certificate_sha256
          tools = sorted((Path(os.environ['ANDROID_HOME']) / 'build-tools').glob('*/apksigner'),
              key=lambda p: tuple(map(int, re.findall(r'\d+', p.parent.name))))[-1].parent
          apk = Path('../debug-output/localtube-transcript-debug.apk')
          cert = certificate_sha256(subprocess.check_output([str(tools/'apksigner'), 'verify', '--print-certs', str(apk)], text=True))
          assert cert == os.environ['EXPECTED_CERTIFICATE'].lower()
          badging = subprocess.check_output([str(tools/'aapt'), 'dump', 'badging', str(apk)], text=True)
          identity = re.search(r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", badging, re.M)
          assert identity and identity[1] == os.environ['LOCALTUBE_PREVIEW_APPLICATION_ID']
          assert 'application-debuggable' in badging
          source = json.loads(Path('../.localtube/source.json').read_text())
          assert int(identity[2]) == source['versionCode']
          metadata = {**source, 'githubCommit': os.environ['GITHUB_SHA'], 'applicationId': identity[1],
              'versionName': identity[3], 'certificateSha256': cert,
              'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(), 'size': apk.stat().st_size}
          Path('../debug-output/build.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(json.dumps(metadata))
          PY
      - name: Save test APK only
        uses: actions/upload-artifact@v4
        with:
          name: localtube-transcript-debug-${{ github.run_id }}
          path: debug-output/
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/transcript-debug.jks"
