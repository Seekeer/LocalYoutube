name: Flutter Windows Preview
# Delivery recognises builds by this exact title; keep "Windows preview · <sha>".
run-name: Windows preview · ${{ github.sha }}

# Like Android Preview: every Flutter change on main, or on demand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Flutter/**'
      - '.localtube/source.json'
      - '.github/workflows/flutter-windows-preview.yml'

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      LOCALTUBE_BINARY_NAME: localtube
      # A separate product name gives Preview its own AppData folder and title.
      LOCALTUBE_PRODUCT_NAME: localtube-preview
      UPDATE_CHANNEL: windows-preview
      WINDOWS_APPLICATION_ID: localtube.windows.preview
    defaults:
      run:
        working-directory: Flutter
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: false

      - name: Enable Windows desktop
        run: |
          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Failed to enable Windows desktop' }

      - name: Restore dependencies
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency restore failed' }

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if ($LASTEXITCODE -ne 0) { throw 'Flutter analyze failed' }

      - name: Test
        run: |
          flutter test --concurrency=2
          if ($LASTEXITCODE -ne 0) { throw 'Flutter tests failed' }

      - name: Resolve canonical version
        run: |
          $source = Get-Content ../.localtube/source.json -Raw | ConvertFrom-Json
          if ($source.schemaVersion -ne 1 -or $source.sourceCommit -notmatch '^[0-9a-f]{40}$' -or
              $source.versionCode -le 1000000000 -or $source.versionCode -gt 2100000000) {
            throw 'Invalid canonical source contract'
          }
          "BUILD_NUMBER=$($source.versionCode)" >> $env:GITHUB_ENV
          "VERSION_NAME=1.1.$($source.versionCode - 1000000000)" >> $env:GITHUB_ENV

      - name: Build Windows Preview
        run: |
          flutter build windows --release --target lib/main_prod.dart `
            --dart-define-from-file=config/env/prod.json `
            --dart-define=LOCALTUBE_REQUIRE_SERVER_CONFIG=true `
            --dart-define=LOCALTUBE_WINDOWS_VERSION_CODE="$env:BUILD_NUMBER" `
            --dart-define=LOCALTUBE_WINDOWS_VERSION_NAME="$env:VERSION_NAME" `
            --dart-define=LOCALTUBE_WINDOWS_UPDATE_CHANNEL="$env:UPDATE_CHANNEL" `
            --build-name="$env:VERSION_NAME" --build-number="$env:BUILD_NUMBER"
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      # The ZIP is both the portable download and the in-app update package. Python
      # writes portable "/" member names; localtube-update.json records its identity.
      - name: Package Windows update and delivery manifest
        shell: python
        run: |
          import hashlib, json, os, zipfile
          from pathlib import Path
          release = Path('build/windows/x64/runner/Release')
          required = ['localtube.exe', 'flutter_windows.dll', 'data/app.so', 'data/icudtl.dat']
          missing = [name for name in required if not (release / name).is_file()]
          if missing:
              raise SystemExit('Windows application bundle is incomplete: ' + ', '.join(missing))
          if (release / 'localtube-update.json').exists():
              raise SystemExit('Unexpected identity file in the build output')
          code, name = int(os.environ['BUILD_NUMBER']), os.environ['VERSION_NAME']
          channel, application = os.environ['UPDATE_CHANNEL'], os.environ['WINDOWS_APPLICATION_ID']
          delivery = Path('../delivery')
          delivery.mkdir(exist_ok=True)
          package = delivery / 'localtube-windows-x64.zip'
          with zipfile.ZipFile(package, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(release.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(release).as_posix())
              archive.writestr('localtube-update.json', json.dumps({
                  'schemaVersion': 1, 'channel': channel, 'applicationId': application,
                  'versionCode': code, 'versionName': name}, indent=2) + '\n')
          # The runner's default Python may predate hashlib.file_digest.
          hasher = hashlib.sha256()
          with package.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  hasher.update(chunk)
          digest = hasher.hexdigest()
          source = json.loads(Path('../.localtube/source.json').read_text())
          metadata = {'channel': channel, 'applicationId': application, 'versionCode': code,
                      'versionName': name, 'size': package.stat().st_size, 'sha256': digest,
                      'artifactId': f'{code}-{digest}'}
          manifest = {'schemaVersion': 1, 'repository': os.environ['GITHUB_REPOSITORY'],
                      'githubCommit': os.environ['GITHUB_SHA'], 'sourceCommit': source['sourceCommit'],
                      'runId': int(os.environ['GITHUB_RUN_ID']), 'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                      'channel': channel, 'package': metadata}
          (delivery / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')

      - name: Publish Windows Preview GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tool/ci/publish_release.py --prefix "localtube-$env:UPDATE_CHANNEL" `
            --bundle windows-update.zip ../delivery/localtube-windows-x64.zip ../delivery/manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish Windows release' }
