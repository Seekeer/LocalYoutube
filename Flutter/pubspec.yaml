name: localtube_flutter
description: LocalTube Flutter client bootstrap.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_slidable: ^3.1.2
  dio: ^5.8.0+1
  crypto: ^3.0.6
  drift: 2.28.1
  sqlite3_flutter_libs: ^0.5.38
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  logger: ^2.6.1
  connectivity_plus: ^6.1.5
  signalr_netcore: ^1.4.4
  background_downloader: ^9.5.2
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.18
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  path_provider_platform_interface: ^2.1.2
  video_player_platform_interface: ^6.3.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
